services:
  - type: web
    name: rccg-open-door-parish-api
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rccg-open-door-parish-db
          property: connectionString
      - key: SESSION_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
databases:
  - name: rccg-open-door-parish-db
    plan: basic-256mb
    databaseName: open_door_parish
    user: open_door_admin
